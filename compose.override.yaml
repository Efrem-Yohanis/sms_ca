services:
  sms-sender:
    build:
      context: .
      dockerfile: sms_smsc_sender/Dockerfile
    environment:
      DB_NAME: ${POSTGRES_DB:-campaign_manager}
      DB_USER: ${POSTGRES_USER:-campaign_manager}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-campaign_manager_dev}
      DB_HOST: db
      DB_PORT: 5432
      SMSC_SENDER_DJANGO_API: http://django:8000/api/v1
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_SENT_TOPIC: sent-response
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-SPPzmCFeMC2o0d3B4yaC094nDeE2ryKvKLR60OkUJC0=}
      SMSC_SENDER_RUN_WORKER: "true"
    ports:
      - "${SMS_SENDER_HOST_PORT:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
