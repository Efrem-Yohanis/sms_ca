services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campaign_manager}
      POSTGRES_USER: ${POSTGRES_USER:-campaign_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campaign_manager_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.7.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic sent-response --partitions 20 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic delivery-report --partitions 20 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin_dev_password}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  django:
    build:
      context: .
      dockerfile: sms_campign/Dockerfile
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DB_ENGINE: postgresql
      DB_NAME: ${POSTGRES_DB:-campaign_manager}
      DB_USER: ${POSTGRES_USER:-campaign_manager}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-campaign_manager_dev}
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-docker-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},django"
      SMSC_SENDER_API: http://sms-sender:8001
    volumes:
      - audience_uploads:/app/sms_campign/audience
    ports:
      - "${DJANGO_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/schema/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  admin-backend:
    build:
      context: .
      dockerfile: admin_backend/Dockerfile
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8002"
    environment:
      DB_ENGINE: postgresql
      DB_NAME: ${POSTGRES_DB:-campaign_manager}
      DB_USER: ${POSTGRES_USER:-campaign_manager}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-campaign_manager_dev}
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-docker-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},admin-backend"
      ADMIN_BACKEND_CORS_ORIGINS: "${ADMIN_BACKEND_CORS_ORIGINS:-http://localhost:5173,http://localhost:4173,http://localhost:5123,http://localhost:3000}"
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-SPPzmCFeMC2o0d3B4yaC094nDeE2ryKvKLR60OkUJC0=}
    ports:
      - "${ADMIN_BACKEND_HOST_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/v1/health/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_healthy
    restart: unless-stopped

  audience-worker:
    build:
      context: .
      dockerfile: sms_campign/Dockerfile
    command: sh -c "python manage.py migrate && python manage.py run_audience_build_jobs"
    environment:
      DB_ENGINE: postgresql
      DB_NAME: ${POSTGRES_DB:-campaign_manager}
      DB_USER: ${POSTGRES_USER:-campaign_manager}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-campaign_manager_dev}
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-docker-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},django"
    volumes:
      - audience_uploads:/app/sms_campign/audience
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  status-updater:
    build:
      context: .
      dockerfile: sms_campign/Dockerfile
    command: python -m uvicorn sms_status_updater.app:app --host 0.0.0.0 --port 8010
    environment:
      DB_ENGINE: postgresql
      DB_NAME: ${POSTGRES_DB:-campaign_manager}
      DB_USER: ${POSTGRES_USER:-campaign_manager}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-campaign_manager_dev}
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-docker-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},django"
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_SENT_TOPIC: sent-response
      KAFKA_DELIVERY_TOPIC: delivery-report
      KAFKA_BATCH_SIZE: ${KAFKA_BATCH_SIZE:-1000}
      KAFKA_POLL_INTERVAL_MS: ${KAFKA_POLL_INTERVAL_MS:-1000}
      KAFKA_STARTUP_TIMEOUT_SECONDS: ${KAFKA_STARTUP_TIMEOUT_SECONDS:-300}
      KAFKA_SEND_GROUP: ${KAFKA_SEND_GROUP:-status-updater-send}
      KAFKA_DELIVERY_GROUP: ${KAFKA_DELIVERY_GROUP:-status-updater-delivery}
    ports:
      - "8010:8010"
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  dlr-receiver:
    build:
      context: .
      dockerfile: dlr_receiver/Dockerfile
    container_name: sms-dlr-receiver
    restart: unless-stopped
    environment:
      DLR_RECEIVER_PORT: '8003'
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_DELIVERY_TOPIC: delivery-report
      DLR_QUEUE_MAX: ${DLR_QUEUE_MAX:-100000}
      DLR_BATCH_SIZE: ${DLR_BATCH_SIZE:-100}
      DLR_FLUSH_INTERVAL: ${DLR_FLUSH_INTERVAL:-0.05}
      DLR_MAX_RETRIES: ${DLR_MAX_RETRIES:-5}
      DLR_RETRY_BACKOFF: ${DLR_RETRY_BACKOFF:-2.0}
      DLR_KAFKA_STARTUP_TIMEOUT: ${DLR_KAFKA_STARTUP_TIMEOUT:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - '8003:8003'
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - default

  smsc-mock:
    build:
      context: .
      dockerfile: sms_smsc_mock/Dockerfile
    container_name: sms-mock-smsc
    environment:
      SMSC_MOCK_DATABASE: /data/smsc_mock.sqlite3
      SMSC_MOCK_DLR_CALLBACK_URL: ${SMSC_MOCK_DLR_CALLBACK_URL:-http://dlr-receiver:8003/api/v1/delivery-reports/callback/}
      SMSC_MOCK_USERNAME: ${SMSC_MOCK_USERNAME:-test-user}
      SMSC_MOCK_PASSWORD: ${SMSC_MOCK_PASSWORD:-test-pass}
      SMSC_MOCK_MAX_TPS: ${SMSC_MOCK_MAX_TPS:-5000}
      SMSC_MOCK_TPS_BURST: ${SMSC_MOCK_TPS_BURST:-5000}
      SMSC_MOCK_MIN_DELAY_SECONDS: ${SMSC_MOCK_MIN_DELAY_SECONDS:-1.0}
      SMSC_MOCK_MAX_DELAY_SECONDS: ${SMSC_MOCK_MAX_DELAY_SECONDS:-5.0}
      SMSC_MOCK_DELIVRD_WEIGHT: ${SMSC_MOCK_DELIVRD_WEIGHT:-0.92}
      SMSC_MOCK_UNDELIV_WEIGHT: ${SMSC_MOCK_UNDELIV_WEIGHT:-0.04}
      SMSC_MOCK_EXPIRED_WEIGHT: ${SMSC_MOCK_EXPIRED_WEIGHT:-0.02}
      SMSC_MOCK_REJECTD_WEIGHT: ${SMSC_MOCK_REJECTD_WEIGHT:-0.02}
      SMSC_MOCK_DLR_RETRIES: ${SMSC_MOCK_DLR_RETRIES:-3}
      SMSC_MOCK_DLR_RETRY_BACKOFF: ${SMSC_MOCK_DLR_RETRY_BACKOFF:-2.0}
      SMSC_MOCK_QUEUE_MAX: ${SMSC_MOCK_QUEUE_MAX:-50000}
      SMSC_MOCK_BATCH_SIZE: ${SMSC_MOCK_BATCH_SIZE:-1000}
      SMSC_MOCK_FLUSH_INTERVAL: ${SMSC_MOCK_FLUSH_INTERVAL:-0.01}
      SMSC_MOCK_LOG_LEVEL: ${SMSC_MOCK_LOG_LEVEL:-INFO}
    ports:
      - "8090:8090"
    volumes:
      - smsc_mock_data:/data
    depends_on:
      dlr-receiver:
        condition: service_healthy
    networks:
      default:
        aliases:
          - mock-smsc
          - mock-smsc.local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  airflow-init:
    image: apache/airflow:2.10.5-python3.11
    user: "${AIRFLOW_UID:-50000}:0"
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKERS: "1"
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-campaign_manager}:${POSTGRES_PASSWORD:-campaign_manager_dev}@db:5432/${POSTGRES_DB:-campaign_manager}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-sms-airflow-local-secret-change-before-deploy}
      AIRFLOW_DJANGO_API: http://django:8000/api/v1
      AIRFLOW_SENDER_API: http://sms-sender:8001
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-change-this-local-password}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
    command:
      - bash
      - -ec
      - |
        airflow db migrate
        if ! airflow users list --output table | grep -Fq "$$AIRFLOW_ADMIN_USERNAME"; then
          airflow users create --username "$$AIRFLOW_ADMIN_USERNAME" --firstname Airflow --lastname Admin --role Admin --email "$$AIRFLOW_ADMIN_EMAIL" --password "$$AIRFLOW_ADMIN_PASSWORD"
        fi
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.11
    user: "${AIRFLOW_UID:-50000}:0"
    environment: *airflow-environment
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      django:
        condition: service_healthy
      sms-sender:
        condition: service_started
    restart: unless-stopped

  airflow-webserver:
    image: apache/airflow:2.10.5-python3.11
    user: "${AIRFLOW_UID:-50000}:0"
    environment: *airflow-environment
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ui:
    build:
      context: ./sms_ui
      dockerfile: Dockerfile
      args:
        VITE_ADMIN_API_BASE_URL: ${VITE_ADMIN_API_BASE_URL:-http://localhost:8002}
    ports:
      - "3000:80"
    depends_on:
      django:
        condition: service_healthy
      admin-backend:
        condition: service_healthy
    restart: unless-stopped

  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
      args:
        VITE_ADMIN_API_URL: ${VITE_ADMIN_API_URL:-http://localhost:8002/api/v1}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NODE_ENV: production
    ports:
      - "${ADMIN_UI_HOST_PORT:-4173}:3000"
    depends_on:
      admin-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  audience_uploads:
    name: sms_audience_uploads
  pgadmin_data:
  kafka_data:
  smsc_mock_data:
  airflow_logs:

networks:
  default:
    name: ${SMS_NETWORK_NAME:-sms-network}